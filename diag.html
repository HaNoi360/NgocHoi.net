<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chẩn đoán offline</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 12px; background: #fff; color: #111; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  button { font: inherit; padding: 10px 16px; margin: 0 8px 8px 0; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f4f4f4; padding: 10px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
<h1>Chẩn đoán bản offline</h1>
<p>Mở trang này <b>khi có mạng</b>, đợi vài giây rồi bấm "Sao chép" hoặc chụp màn hình gửi lại.</p>
<button id="run">Chạy lại</button><button id="copy">Sao chép</button>
<pre id="out">Đang kiểm tra…</pre>
<script>
(async () => {
  const out = document.getElementById("out");
  const lines = [];
  const log = (k, v) => lines.push(k + ": " + (typeof v === "string" ? v : JSON.stringify(v)));
  async function head(u) {
    try { const r = await fetch(u, { method: "GET", cache: "no-store", redirect: "manual" }); return `${r.type}/${r.status} ${r.headers.get("content-type") || ""}`; }
    catch (e) { return "LỖI " + e.message; }
  }
  async function run() {
    lines.length = 0; out.textContent = "Đang kiểm tra…";
    log("Địa chỉ trang", location.href);
    log("Có mạng", navigator.onLine);
    log("Chế độ hiển thị", ["fullscreen", "standalone", "minimal-ui", "browser"].filter(m => matchMedia("(display-mode: " + m + ")").matches));
    log("Thiết bị", navigator.userAgent);
    try { log("localStorage", Object.fromEntries(Object.keys(localStorage).filter(k => /^ap_/.test(k)).map(k => [k, localStorage.getItem(k)]))); } catch (e) { log("localStorage", "LỖI " + e.message); }

    // Manifest
    try {
      const href = document.querySelector('link[rel=manifest]')?.href || new URL("./manifest.json", location.href).href;
      const m = await (await fetch(href, { cache: "no-store" })).json();
      log("Manifest", { url: href, start_url_đầy_đủ: new URL(m.start_url, href).href, scope_đầy_đủ: new URL(m.scope || "./", href).href });
    } catch (e) { log("Manifest", "LỖI " + e.message); }

    // Service worker
    log("Trang này đang được SW điều khiển", !!navigator.serviceWorker?.controller);
    let regs = [];
    try { regs = await navigator.serviceWorker.getRegistrations(); } catch (e) { log("getRegistrations", "LỖI " + e.message); }
    log("Số SW đã đăng ký", regs.length);
    for (const r of regs) log("SW", { scope: r.scope, script: (r.active || r.waiting || r.installing)?.scriptURL, active: r.active?.state || null, waiting: r.waiting?.state || null, installing: r.installing?.state || null, updateViaCache: r.updateViaCache });

    // Hỏi thẳng SW nó thấy gì (đây là mấu chốt)
    const reg = regs.find(r => r.active);
    if (reg) {
      try {
        const ch = new MessageChannel();
        const answer = new Promise((res, rej) => { ch.port1.onmessage = e => res(e.data); setTimeout(() => rej(new Error("SW không trả lời sau 6 giây (có thể là bản sw.js cũ chưa có chẩn đoán)")), 6000); });
        reg.active.postMessage({ type: "diag" }, [ch.port2]);
        const d = await answer;
        log("SW: phiên bản (REV)", d.rev);
        log("SW: lấy từ ?v= của địa chỉ đăng ký", d.urlV);
        log("SW: phiên bản trong config.js nó đọc được", d.configRev);
        log("SW: tên bộ nhớ giao diện", d.shellCache);
        log("SW: phạm vi (scope)", d.scope);
        for (const [k, v] of Object.entries(d.caches)) log("  Bộ nhớ " + k + " (" + v.length + " mục)", v.filter(u => !/\/fonts\//.test(u)).slice(0, 40));
        log("SW tự thử KHI OFFLINE → ./index.html", d.offlineTests["./index.html"]);
        log("SW tự thử KHI OFFLINE → ./", d.offlineTests["./"]);
      } catch (e) { log("Hỏi SW", "LỖI " + e.message); }
    } else log("SW", "KHÔNG có SW nào đang hoạt động → khi tắt mạng sẽ hiện 'Không thể truy cập'");

    // Bộ nhớ nhìn từ trang
    try { const names = await caches.keys(); log("Các bộ nhớ (từ trang)", names); } catch (e) { log("caches", "LỖI " + e.message); }

    // Tệp thiết yếu có thật trên host không
    const files = ["./index.html", "./", "./sw.js", "./config.js", "./app.js", "./app.css", "./theme.css", "./manifest.json", "./tours/index.json", "./icons/icon-192.png", "./icons/icon-512.png", "./icons/icon-maskable-512.png", "./icons/icon.svg", "./vendor/bootstrap.min.css", "./vendor/bootstrap.bundle.min.js", "./vendor/pannellum.css", "./vendor/pannellum.js", "./fonts/be-vietnam-pro-latin-400-normal.woff2"];
    for (const f of files) log("Host trả về " + f, await head(f));
    out.textContent = lines.join("\n");
  }
  document.getElementById("run").onclick = run;
  document.getElementById("copy").onclick = async () => { try { await navigator.clipboard.writeText(out.textContent); alert("Đã sao chép"); } catch (e) { alert("Không sao chép được, hãy chụp màn hình."); } };
  run();
})();
</script>
</body>
</html>
